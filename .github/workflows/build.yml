
name: Build Lia AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools
          pip install buildozer cython==0.29.33

      - name: Configure Android build
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Lia AI
          package.name = liaai
          package.domain = org.liaai
          source.dir = .
          source.include_exts = py,kv,png,jpg,atlas
          version = 0.1.0
          requirements = python3,kivy,openai,python-dotenv,plyer
          orientation = portrait
          android.permissions = INTERNET,RECORD_AUDIO
          android.api = 35
          android.minapi = 23
          android.archs = arm64-v8a
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        run: |
          . .venv/bin/activate
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaAI-debug-APK
          path: bin/*.apk
          if-no-files-found: error
